search:
  keywords:
    - MuleSoft
    - TIBCO
    - TIBCO AMX BPM
    - AMX BPM
  locations:
    - Germany
    - Remote
    - Hybrid
    - Berlin
    - Frankfurt
    - Munich
    - Hamburg
    - Stuttgart
    - Düsseldorf
    - Cologne

sites:
  freelancermap:
    enabled: false
  freelance_de:
    enabled: true
  gulp:
    enabled: false
  jobserve:
    enabled: false

rate_limit:
  min_delay: 2.0
  max_delay: 5.0

notifications:
  telegram:
    enabled: true
  email:
    enabled: true
  # Set to true to send a notification even if there are no new postings
  heartbeat_when_empty: false

ranking:
  # Higher weight = more relevant
  weights:
    mulesoft: 10.0
    anypoint: 9.0
    tibco amx bpm: 10.0
    amx bpm: 10.0
  # Multiplier applied when the location matches a major city or remote
  location_boost: 1.5

database:
  path: data/seen_postings.db

log_level: INFO
